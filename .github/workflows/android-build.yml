name: Build PRIYO STORE V91 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build PRIYO STORE V91
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find V90 Source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            \( -name 'PRIYO_STORE_V90_LOGIN_SESSION_FIXED.zip' \
            -o -name 'PRIYO_STORE_V90*.zip' \) \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: PRIYO STORE V90 source ZIP not found."
            exit 1
          fi

          echo "SOURCE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using source: $ZIP_FILE"

      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$SOURCE_ZIP" -d android-project

          echo "Extracted project:"
          find android-project -maxdepth 4 -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print

      - name: Locate Android Project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SETTINGS_FILES < <(
            find android-project -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -print | sort
          )

          if [ "${#SETTINGS_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."
            exit 1
          fi

          if [ "${#SETTINGS_FILES[@]}" -gt 1 ]; then
            echo "ERROR: Multiple Android project roots found:"
            printf '%s\n' "${SETTINGS_FILES[@]}"
            exit 1
          fi

          PROJECT_DIR="$(dirname "${SETTINGS_FILES[0]}")"

          if [ ! -f "$PROJECT_DIR/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: Root Gradle build file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          touch gradle.properties

          if ! grep -q '^android.useAndroidX=true' gradle.properties; then
            echo 'android.useAndroidX=true' >> gradle.properties
          fi

          if ! grep -q '^android.enableJetifier=true' gradle.properties; then
            echo 'android.enableJetifier=true' >> gradle.properties
          fi

      - name: Fix Duplicate Launcher Color Resource
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t COLOR_FILES < <(
            find "$PROJECT_DIR" -type f \
              -path '*/src/*/res/values/ic_launcher_colors.xml' \
              -print | sort
          )

          echo "Launcher color files found:"
          printf '%s\n' "${COLOR_FILES[@]}"

          for FILE in "${COLOR_FILES[@]}"; do
            [ -f "$FILE" ] || continue

            python3 - "$FILE" <<'PY'
import sys
import xml.etree.ElementTree as ET
from pathlib import Path

path = Path(sys.argv[1])

try:
    tree = ET.parse(path)
    root = tree.getroot()
except Exception as e:
    print(f"Could not parse {path}: {e}")
    sys.exit(0)

seen = set()
removed = 0

for child in list(root):
    if child.tag != "color":
        continue

    name = child.attrib.get("name")
    if not name:
        continue

    if name in seen:
        root.remove(child)
        removed += 1
    else:
        seen.add(name)

if removed:
    ET.indent(tree, space="    ")
    tree.write(path, encoding="utf-8", xml_declaration=True)
    print(f"Removed {removed} duplicate color resource(s) from {path}")
else:
    print(f"No duplicate color resources in {path}")
PY
          done

      - name: Select Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
            echo "Using project Gradle wrapper."
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
            echo "Using Gradle 8.7."
          fi

      - name: Inspect Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Gradle:"
          "$GRADLE_CMD" --version

          echo "Android project files:"
          find . -maxdepth 3 -type f | sort | head -300

      - name: Clean Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          "$GRADLE_CMD" clean \
            --no-daemon \
            --stacktrace

      - name: Build PRIYO STORE V91 Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Starting PRIYO STORE V91 build..."

          "$GRADLE_CMD" assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find "$PROJECT_DIR" -type f \
              -path '*/build/outputs/apk/debug/*.apk' \
              -print | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: No Debug APK was generated."
            exit 1
          fi

          echo "APK found:"
          printf '%s\n' "${APKS[@]}"

          mkdir -p release
          cp "${APKS[0]}" "release/PRIYO-STORE-V91.apk"

      - name: Upload PRIYO STORE V91 APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-V91-APK
          path: release/PRIYO-STORE-V91.apk
          if-no-files-found: error
