name: PRIYO APP Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build PRIYO APP APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle
        run: |
          gradle --version

      - name: Verify Android project
        run: |
          test -f build.gradle
          test -d app
          test -f app/build.gradle

      - name: Build Debug APK
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi
          echo "APK created: $APK"

      - name: Upload PRIYO APP APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-APP-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
