name: PRIYO APP Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Remove duplicate launcher_bg resource if present
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("app/src/main/res")
          target = root / "values" / "ic_launcher_colors.xml"

          if target.exists():
              text = target.read_text(encoding="utf-8")
              fixed = re.sub(
                  r'\s*<color\s+name=["\']launcher_bg["\']\s*>.*?</color>\s*',
                  '\n',
                  text,
                  flags=re.DOTALL,
              )
              if fixed != text:
                  target.write_text(fixed, encoding="utf-8")
                  print("Removed duplicate launcher_bg")
              else:
                  print("No duplicate launcher_bg found")
          else:
              print("No launcher color file found; continuing")
          PY

      - name: Build PRIYO STORE Debug APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload PRIYO STORE APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error