name: Build PRIYO STORE V94

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build PRIYO STORE V94 APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # GRADLE 8.9
      # =========================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # FIND ANDROID PROJECT
      # =========================================================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "=============================================="

          PROJECT_DIR=""

          # -----------------------------------------------------
          # First: existing Android project
          # -----------------------------------------------------
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$(pwd)"
          fi

          # -----------------------------------------------------
          # Second: search for settings.gradle
          # -----------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r file; do
              if [ -n "$file" ]; then
                PROJECT_DIR="$(cd "$(dirname "$file")" && pwd)"
                break
              fi
            done < <(
              find . \
                -type f \
                \( \
                  -name "settings.gradle" \
                  -o -name "settings.gradle.kts" \
                \) \
                -not -path "*/.gradle/*" \
                -not -path "*/build/*" \
                -print
            )
          fi

          # -----------------------------------------------------
          # Third: find Android source ZIP
          # -----------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            ZIP_FILE=""

            while IFS= read -r file; do
              if [ -n "$file" ]; then
                ZIP_FILE="$file"
                break
              fi
            done < <(
              find . \
                -type f \
                \( \
                  -iname "*V94*.zip" \
                  -o -iname "*V91*.zip" \
                  -o -iname "*V90*.zip" \
                \) \
                -print
            )

            if [ -n "$ZIP_FILE" ]; then

              echo "SOURCE ZIP FOUND:"
              echo "$ZIP_FILE"

              rm -rf android-source
              mkdir -p android-source

              unzip -q "$ZIP_FILE" -d android-source

              while IFS= read -r file; do
                if [ -n "$file" ]; then
                  PROJECT_DIR="$(cd "$(dirname "$file")" && pwd)"
                  break
                fi
              done < <(
                find android-source \
                  -type f \
                  \( \
                    -name "settings.gradle" \
                    -o -name "settings.gradle.kts" \
                  \) \
                  -not -path "*/.gradle/*" \
                  -not -path "*/build/*" \
                  -print
              )

            fi
          fi

          # -----------------------------------------------------
          # Fourth: app directory fallback
          # -----------------------------------------------------
          if [ -z "$PROJECT_DIR" ] && [ -d "app" ]; then
            if [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
              PROJECT_DIR="$(pwd)"
            fi
          fi

          # -----------------------------------------------------
          # Stop if project was not found
          # -----------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "ERROR: Android project was not found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 4 -type f -print | head -300

            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "ANDROID PROJECT FOUND"
          echo "=============================================="
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # PREPARE ROOT GRADLE FILES
      # =========================================================
      - name: Prepare Gradle Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "PREPARING GRADLE PROJECT"
          echo "=============================================="

          # -----------------------------------------------------
          # Create settings.gradle only if missing
          # -----------------------------------------------------
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then

            cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PRIYO-STORE"
          include(":app")
          EOF

          fi

          # -----------------------------------------------------
          # Create root build.gradle only if missing
          # -----------------------------------------------------
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then

            cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          fi

          # -----------------------------------------------------
          # Verify app module
          # -----------------------------------------------------
          if [ -f "app/build.gradle" ]; then
            echo "app/build.gradle FOUND."
          elif [ -f "app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts FOUND."
          else
            echo "ERROR: Android app module was not found."
            exit 1
          fi

          echo ""
          echo "PROJECT ROOT:"
          pwd

          echo ""
          echo "PROJECT CONTENTS:"
          ls -la

      # =========================================================
      # PREPARE GRADLE WRAPPER
      # =========================================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "PREPARING GRADLE WRAPPER"
          echo "=============================================="

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            echo "Existing Gradle wrapper found."

          else

            echo "Gradle wrapper not found."
            echo "Generating Gradle 8.9 wrapper..."

            gradle wrapper --gradle-version 8.9

            chmod +x ./gradlew

          fi

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      # =========================================================
      # VERIFY PROJECT
      # =========================================================
      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "VERIFYING ANDROID PROJECT"
          echo "=============================================="

          if [ -f "settings.gradle" ]; then
            echo "settings.gradle: FOUND"
          elif [ -f "settings.gradle.kts" ]; then
            echo "settings.gradle.kts: FOUND"
          else
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi

          if [ -f "app/build.gradle" ]; then
            echo "app/build.gradle: FOUND"
          elif [ -f "app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts: FOUND"
          else
            echo "ERROR: app Gradle file missing."
            exit 1
          fi

          echo ""
          echo "Android project verification completed."

      # =========================================================
      # CLEAN
      # =========================================================
      - name: Clean Android Build
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "CLEANING ANDROID BUILD"
          echo "=============================================="

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # =========================================================
      # BUILD DEBUG APK
      # =========================================================
      - name: Build PRIYO STORE V94 APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "BUILDING PRIYO STORE V94 APK"
          echo "=============================================="

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "=============================================="
          echo "GRADLE BUILD SUCCESSFUL"
          echo "=============================================="

      # =========================================================
      # FIND APK
      # =========================================================
      - name: Locate Generated APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "SEARCHING FOR GENERATED APK"
          echo "=============================================="

          APK_FILE=""

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              APK_FILE="$file"
              break
            fi
          done < <(
            find . \
              -type f \
              -path "*/build/outputs/apk/*.apk" \
              -print
          )

          if [ -z "$APK_FILE" ]; then

            echo ""
            echo "ERROR: APK was not generated."
            echo ""
            echo "Available APK files:"
            find . -type f -name "*.apk" -print

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/output/PRIYO_STORE_V94.apk"

          test -s "$GITHUB_WORKSPACE/output/PRIYO_STORE_V94.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh "$GITHUB_WORKSPACE/output/PRIYO_STORE_V94.apk"

      # =========================================================
      # UPLOAD APK
      # =========================================================
      - name: Upload PRIYO STORE V94 APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-V94-APK
          path: output/PRIYO_STORE_V94.apk
          if-no-files-found: error

      # =========================================================
      # COMPLETE
      # =========================================================
      - name: Build Complete
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "PRIYO STORE V94 BUILD COMPLETE"
          echo "=============================================="

          ls -lh \
            "$GITHUB_WORKSPACE/output/PRIYO_STORE_V94.apk"

          echo ""
          echo "V94 APK ARTIFACT IS READY."
