name: Build PRIYO STORE V91 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build PRIYO STORE V91
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find V91 Source ZIP
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="$(find . -maxdepth 5 -type f \
            -name 'PRIYO_STORE_V91_FINAL_2.zip' \
            -print -quit)"

          if [ -z "$SOURCE_ZIP" ]; then
            echo "ERROR: PRIYO_STORE_V91_FINAL_2.zip not found."
            find . -maxdepth 5 -type f -name '*.zip' -print || true
            exit 1
          fi

          echo "V91 source found: $SOURCE_ZIP"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Extract V91 Android Project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$SOURCE_ZIP" -d build_source

      - name: Locate Android Project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find build_source -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings file not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT_DIR"

      - name: Verify V91 Version
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_DIR/app/build.gradle"
          APP_GRADLE_KTS="$PROJECT_DIR/app/build.gradle.kts"

          VERSION_CODE=""
          VERSION_NAME=""

          if [ -f "$APP_GRADLE" ]; then

            VERSION_CODE="$(grep -E \
              '^[[:space:]]*versionCode[[:space:]]+[0-9]+' \
              "$APP_GRADLE" |
              head -1 |
              grep -oE '[0-9]+' |
              tail -1 || true)"

            VERSION_NAME="$(grep -E \
              '^[[:space:]]*versionName[[:space:]]+' \
              "$APP_GRADLE" |
              head -1 |
              sed -nE \
              's/.*versionName[[:space:]]+["'"'"']([^"'"'"']+)["'"'"'].*/\1/p' |
              head -1 |
              tr -d '\r\n' |
              xargs || true)"

          elif [ -f "$APP_GRADLE_KTS" ]; then

            VERSION_CODE="$(grep -E \
              '^[[:space:]]*versionCode[[:space:]]*=' \
              "$APP_GRADLE_KTS" |
              head -1 |
              grep -oE '[0-9]+' |
              tail -1 || true)"

            VERSION_NAME="$(grep -E \
              '^[[:space:]]*versionName[[:space:]]*=' \
              "$APP_GRADLE_KTS" |
              head -1 |
              sed -nE \
              's/.*versionName[[:space:]]*=[[:space:]]+["'"'"']([^"'"'"']+)["'"'"'].*/\1/p' |
              head -1 |
              tr -d '\r\n' |
              xargs || true)"

          else
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found."
            exit 1
          fi

          echo "Detected versionCode: [$VERSION_CODE]"
          echo "Detected versionName: [$VERSION_NAME]"

          if [ "$VERSION_CODE" != "91" ]; then
            echo "ERROR: versionCode must be 91."
            exit 1
          fi

          NORMALIZED_VERSION_NAME="$(printf '%s' "$VERSION_NAME" | tr -d '[:space:]\r\n')"

          if [ "$NORMALIZED_VERSION_NAME" != "1.0.91" ]; then
            echo "ERROR: versionName must be 1.0.91."
            echo "Detected: [$NORMALIZED_VERSION_NAME]"
            exit 1
          fi

          echo "OK: PRIYO STORE V91 verified."

      - name: Remove Duplicate Launcher Colors
        shell: bash
        run: |
          set -euo pipefail

          DUPLICATE_FILE="$PROJECT_DIR/app/src/main/res/values/ic_launcher_colors.xml"

          if [ -f "$DUPLICATE_FILE" ]; then
            rm -f "$DUPLICATE_FILE"
          fi

          if [ -f "$DUPLICATE_FILE" ]; then
            echo "ERROR: duplicate launcher color file still exists."
            exit 1
          fi

      - name: Verify launcher_bg
        shell: bash
        run: |
          set -euo pipefail

          COLORS_FILE="$PROJECT_DIR/app/src/main/res/values/colors.xml"

          if [ ! -f "$COLORS_FILE" ]; then
            echo "ERROR: colors.xml not found."
            exit 1
          fi

          COUNT="$(grep -o 'name="launcher_bg"' \
            "$COLORS_FILE" |
            wc -l |
            tr -d ' ')"

          echo "launcher_bg count: $COUNT"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: launcher_bg must exist exactly once."
            exit 1
          fi

      - name: Create Kotlin Dependency Fix
        shell: bash
        run: |
          set -euo pipefail

          cat > "$GITHUB_WORKSPACE/kotlin-fix.init.gradle" <<'EOF'
          allprojects {
              configurations.configureEach {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"

                  resolutionStrategy.force(
                      "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                  )
              }
          }
          EOF

      - name: Clean Android Build
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf app/build

          gradle clean \
            --no-daemon \
            --init-script "$GITHUB_WORKSPACE/kotlin-fix.init.gradle"

      - name: Build PRIYO STORE V91 APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --init-script "$GITHUB_WORKSPACE/kotlin-fix.init.gradle"

      - name: Verify Generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: V91 APK was not generated."

            find "$PROJECT_DIR" \
              -type f \
              -name '*.apk' \
              -print || true

            exit 1
          fi

          mkdir -p release

          cp "$APK_FILE" \
            "release/PRIYO-STORE-V91.apk"

          ls -lh "release/PRIYO-STORE-V91.apk"

      - name: Upload PRIYO STORE V91 APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-V91-APK
          path: release/PRIYO-STORE-V91.apk
          if-no-files-found: error
