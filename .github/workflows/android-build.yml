name: Build PRIYO STORE V91

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build PRIYO STORE V91 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---------------------------------------------------------
      # Find Android project safely
      # ---------------------------------------------------------
      - name: Locate Android Source
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "======================================"

          PROJECT_DIR=""

          # First: look for an existing Gradle Android project
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              PROJECT_DIR="$(dirname "$file")"
              break
            fi
          done < <(
            find . \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print
          )

          # If no Gradle project exists, look for V91 ZIP
          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE=""

            while IFS= read -r file; do
              if [ -n "$file" ]; then
                ZIP_FILE="$file"
                break
              fi
            done < <(
              find . \
                -type f \
                -iname "*V91*.zip" \
                -print
            )

            if [ -n "$ZIP_FILE" ]; then
              echo "Found V91 ZIP:"
              echo "$ZIP_FILE"

              mkdir -p android-source

              unzip -q "$ZIP_FILE" -d android-source

              while IFS= read -r file; do
                if [ -n "$file" ]; then
                  PROJECT_DIR="$(dirname "$file")"
                  break
                fi
              done < <(
                find android-source \
                  -type f \
                  \( -name "build.gradle" -o -name "build.gradle.kts" \) \
                  -print
              )
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: Android Gradle project was not found."
            echo ""
            echo "Files in repository:"
            find . -maxdepth 3 -type f -print | head -200
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # Show project structure
      # ---------------------------------------------------------
      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "PROJECT STRUCTURE"
          echo "======================================"

          pwd
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      # ---------------------------------------------------------
      # Prepare Gradle wrapper
      # ---------------------------------------------------------
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found."
            echo "Generating Gradle wrapper..."

            gradle wrapper --gradle-version 8.9

            chmod +x ./gradlew
          fi

      # ---------------------------------------------------------
      # Clean build
      # ---------------------------------------------------------
      - name: Clean Android Build
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean --no-daemon

      # ---------------------------------------------------------
      # Build APK
      # ---------------------------------------------------------
      - name: Build PRIYO STORE APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING PRIYO STORE"
          echo "======================================"

          ./gradlew assembleDebug --no-daemon --stacktrace

      # ---------------------------------------------------------
      # Find generated APK
      # ---------------------------------------------------------
      - name: Locate Generated APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "SEARCHING FOR GENERATED APK"
          echo "======================================"

          APK=""

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              APK="$file"
              break
            fi
          done < <(
            find . \
              -type f \
              -name "*.apk" \
              -print
          )

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" "$GITHUB_WORKSPACE/output/PRIYO_STORE_V91.apk"

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload PRIYO STORE V91 APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-V91-APK
          path: output/PRIYO_STORE_V91.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # Build complete
      # ---------------------------------------------------------
      - name: Build Complete
        shell: bash
        run: |
          echo "======================================"
          echo "PRIYO STORE V91 BUILD COMPLETE"
          echo "======================================"
          ls -lh "$GITHUB_WORKSPACE/output/PRIYO_STORE_V91.apk"
