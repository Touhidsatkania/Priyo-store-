name: Build PRIYO STORE V91 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build PRIYO STORE V91
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find V91 Source ZIP
        shell: bash
        run: |
          set -e

          SOURCE_ZIP="$(find . -maxdepth 2 -type f \
            -name 'PRIYO_STORE_V91_LOGIN_OTP_DISABLED.zip' \
            -print -quit)"

          if [ -z "$SOURCE_ZIP" ]; then
            echo "ERROR: PRIYO_STORE_V91_LOGIN_OTP_DISABLED.zip not found."
            echo "V90 fallback is not allowed."
            exit 1
          fi

          echo "V91 Source ZIP found:"
          echo "$SOURCE_ZIP"

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Extract V91 Android Project
        shell: bash
        run: |
          set -e

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$SOURCE_ZIP" -d build_source

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find build_source -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings file not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Remove Duplicate Launcher Color
        shell: bash
        run: |
          set -e

          DUPLICATE_FILE="$PROJECT_DIR/app/src/main/res/values/ic_launcher_colors.xml"

          if [ -f "$DUPLICATE_FILE" ]; then
            echo "Removing duplicate launcher color file:"
            echo "$DUPLICATE_FILE"
            rm -f "$DUPLICATE_FILE"
          fi

          if [ -f "$DUPLICATE_FILE" ]; then
            echo "ERROR: Duplicate launcher color file still exists."
            exit 1
          fi

          echo "OK: Duplicate launcher color file removed."

      - name: Verify launcher_bg
        shell: bash
        run: |
          set -e

          COLORS_FILE="$PROJECT_DIR/app/src/main/res/values/colors.xml"

          if [ ! -f "$COLORS_FILE" ]; then
            echo "ERROR: colors.xml not found."
            exit 1
          fi

          COUNT="$(grep -o 'name="launcher_bg"' "$COLORS_FILE" | wc -l)"

          echo "launcher_bg count: $COUNT"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: launcher_bg must exist exactly once."
            exit 1
          fi

          echo "OK: launcher_bg verified."

      - name: Verify V91 Version
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          if ! grep -qE 'versionCode[[:space:]]+91' "$APP_GRADLE"; then
            echo "ERROR: versionCode 91 not found."
            exit 1
          fi

          if ! grep -qE 'versionName[[:space:]]+["'\'']1\.0\.91["'\'']' "$APP_GRADLE"; then
            echo "ERROR: versionName 1.0.91 not found."
            exit 1
          fi

          echo "OK: V91 version verified."

      - name: Clean Android Build
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf app/build

          gradle clean --no-daemon

      - name: Build PRIYO STORE V91 APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building PRIYO STORE V91..."

          gradle assembleDebug --no-daemon --stacktrace

      - name: Find V91 APK
        shell: bash
        run: |
          set -e

          APK_FILE="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: V91 APK was not generated."
            exit 1
          fi

          mkdir -p release

          cp "$APK_FILE" "release/PRIYO-STORE-V91.apk"

          echo "V91 APK created successfully:"
          ls -lh "release/PRIYO-STORE-V91.apk"

      - name: Upload PRIYO STORE V91 APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-V91-APK
          path: release/PRIYO-STORE-V91.apk
          if-no-files-found: error
