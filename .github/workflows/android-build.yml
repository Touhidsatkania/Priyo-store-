name: Build PRIYO STORE V94

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build PRIYO STORE V94 APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # GRADLE 8.9
      # AGP 8.7.x requires Gradle 8.9
      # =========================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # VERIFY SOURCE
      # =========================================================
      - name: Verify PRIYO STORE Source
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFYING PRIYO STORE SOURCE"
          echo "=============================================="

          test -d app
          test -f app/build.gradle

          echo "app directory: OK"
          echo "app/build.gradle: OK"

      # =========================================================
      # CREATE ROOT GRADLE PROJECT
      # =========================================================
      - name: Prepare Gradle Project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "PREPARING GRADLE PROJECT"
          echo "=============================================="

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PRIYO-STORE"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          echo "settings.gradle created."
          echo "build.gradle created."

      # =========================================================
      # VERIFY VERSION
      # Source must already contain V94.
      # =========================================================
      - name: Verify V94 Version
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFYING V94 VERSION"
          echo "=============================================="

          grep -Eq 'versionCode[[:space:]]+94' app/build.gradle
          grep -Eq "versionName[[:space:]]+['\"]1\.0\.94['\"]" app/build.gradle

          echo "versionCode 94: OK"
          echo "versionName 1.0.94: OK"

      # =========================================================
      # VERIFY GRADLE PROJECT
      # =========================================================
      - name: Verify Gradle Project
        shell: bash
        run: |
          set -e

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          echo "settings.gradle: OK"
          echo "build.gradle: OK"
          echo "app/build.gradle: OK"

          echo ""
          echo "Gradle version:"
          gradle --version

      # =========================================================
      # CLEAN
      # =========================================================
      - name: Clean Build
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon \
            --stacktrace

      # =========================================================
      # BUILD DEBUG APK
      # =========================================================
      - name: Build PRIYO STORE V94 APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILDING PRIYO STORE V94 APK"
          echo "=============================================="

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "BUILD SUCCESSFUL."

      # =========================================================
      # VERIFY APK EXISTS
      # =========================================================
      - name: Verify Generated APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFYING GENERATED APK"
          echo "=============================================="

          APK_FILE=""

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              APK_FILE="$file"
              break
            fi
          done < <(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print
          )

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_FILE"

          mkdir -p output

          cp "$APK_FILE" \
            output/PRIYO_STORE_V94.apk

          test -s output/PRIYO_STORE_V94.apk

          echo ""
          echo "FINAL APK:"
          ls -lh output/PRIYO_STORE_V94.apk

      # =========================================================
      # UPLOAD APK
      # =========================================================
      - name: Upload PRIYO STORE V94 APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-V94-APK
          path: output/PRIYO_STORE_V94.apk
          if-no-files-found: error

      # =========================================================
      # COMPLETE
      # =========================================================
      - name: Build Complete
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "PRIYO STORE V94 BUILD COMPLETE"
          echo "=============================================="

          ls -lh output/PRIYO_STORE_V94.apk

          echo ""
          echo "V94 APK ARTIFACT IS READY."
