name: Build PRIYO STORE V91 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build PRIYO STORE V91
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Setup Java 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # 3. Setup Gradle 8.9
      # ---------------------------------------------------------
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ---------------------------------------------------------
      # 4. Locate V91 Android Source
      # ---------------------------------------------------------
      - name: Locate V91 Android Source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build_source
          mkdir -p build_source

          PROJECT_DIR=""

          echo "=========================================="
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "=========================================="

          # First check whether Android project already exists
          # directly inside repository.

          ROOT_APP_GRADLE="$(
            find . -type f \
              -path './app/build.gradle' -o \
                 -path './app/build.gradle.kts' \
              -print -quit
          )"

          if [ -n "$ROOT_APP_GRADLE" ]; then
            PROJECT_DIR="$(dirname "$(dirname "$ROOT_APP_GRADLE")")"

            echo "Android project found directly:"
            echo "$PROJECT_DIR"
          fi


          # -------------------------------------------------------
          # If project is not directly available,
          # find the correct V91 ZIP.
          #
          # IMPORTANT:
          # Do NOT simply use "head -n 1".
          #
          # The repository contains a very small:
          # PRIYO_STORE_V91_BUILD_PACKAGE.zip
          #
          # That package is not the complete Android source.
          #
          # Therefore we select the LARGEST V91 ZIP.
          # -------------------------------------------------------

          if [ -z "$PROJECT_DIR" ]; then

            echo
            echo "Searching V91 ZIP files..."
            echo

            ZIP_LIST="$(
              find . -type f \
                -iname '*V91*.zip' \
                -printf '%s %p\n' \
                2>/dev/null |
              sort -nr
            )"

            if [ -z "$ZIP_LIST" ]; then
              echo "ERROR: No V91 Android source ZIP was found."
              echo
              echo "Available ZIP files:"
              find . -type f -iname '*.zip' -print || true
              exit 1
            fi

            echo "V91 ZIP files found:"
            echo "$ZIP_LIST"
            echo

            # Select the largest V91 ZIP.
            SOURCE_ZIP="$(
              echo "$ZIP_LIST" |
              head -n 1 |
              cut -d' ' -f2-
            )"

            if [ -z "$SOURCE_ZIP" ]; then
              echo "ERROR: SOURCE
