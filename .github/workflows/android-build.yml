            -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

