name: Build PRIYO STORE APK

on:
  push:
    branches:
      - main
    paths:
      - 'PRIYO_STORE_V*.zip'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build PRIYO STORE APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Select latest PRIYO STORE ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 1 -type f -name 'PRIYO_STORE_V*.zip' -printf '%f\n' | sort -V | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::No PRIYO STORE project ZIP found."
            exit 1
          fi

          echo "Selected ZIP: $ZIP"
          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          DIR="extracted/${PROJECT_ZIP%.zip}"

          rm -rf "$DIR"
          mkdir -p "$DIR"

          unzip -q "$PROJECT_ZIP" -d "$DIR"

          GRADLE=$(find "$DIR" -type f -name 'gradlew' | head -n 1)

          if [ -z "$GRADLE" ]; then
            echo "::error::gradlew not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE")

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Android app module not found."
            exit 1
          fi

          echo "Project found: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure AndroidX
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          touch gradle.properties

          if ! grep -q '^android.useAndroidX=' gradle.properties; then
            echo 'android.useAndroidX=true' >> gradle.properties
          fi

          if ! grep -q '^android.enableJetifier=' gradle.properties; then
            echo 'android.enableJetifier=true' >> gradle.properties
          fi

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Selected ZIP:"
          echo "$PROJECT_ZIP"

          echo "Android project:"
          echo "$PROJECT_DIR"

          "$PROJECT_DIR/gradlew" --version

      - name: Build PRIYO STORE APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload PRIYO STORE APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
