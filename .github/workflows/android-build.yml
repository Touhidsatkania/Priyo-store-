name: Build PRIYO STORE V91 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build PRIYO STORE V91
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find V90 Source ZIP
        shell: bash
        run: |
          set -e

          SOURCE_ZIP="$(find . -type f \
            \( \
              -name 'PRIYO_STORE_V90_LOGIN_SESSION_FIXED.zip' \
              -o -name 'PRIYO_STORE_V90*.zip' \
            \) \
            -print -quit)"

          if [ -z "$SOURCE_ZIP" ]; then
            echo "ERROR: PRIYO STORE V90 source ZIP not found."
            exit 1
          fi

          echo "Source ZIP: $SOURCE_ZIP"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Extract V90 Android Project
        shell: bash
        run: |
          set -e

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$SOURCE_ZIP" -d build_source

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find build_source -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."
            find build_source -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Enable AndroidX and Jetifier
        shell: bash
        run: |
          set -e

          PROPERTIES_FILE="$PROJECT_DIR/gradle.properties"

          touch "$PROPERTIES_FILE"

          if ! grep -q '^android.useAndroidX=' "$PROPERTIES_FILE"; then
            echo 'android.useAndroidX=true' >> "$PROPERTIES_FILE"
          else
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$PROPERTIES_FILE"
          fi

          if ! grep -q '^android.enableJetifier=' "$PROPERTIES_FILE"; then
            echo 'android.enableJetifier=true' >> "$PROPERTIES_FILE"
          else
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' "$PROPERTIES_FILE"
          fi

          if ! grep -q '^org.gradle.jvmargs=' "$PROPERTIES_FILE"; then
            echo 'org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' >> "$PROPERTIES_FILE"
          fi

      - name: Remove Duplicate Color Resources
        shell: bash
        run: |
          set -e

          python3 - "$PROJECT_DIR" <<'PY'
          import os
          import re
          import sys

          project_dir = sys.argv[1]

          color_pattern = re.compile(
              r'<color\b[^>]*\bname\s*=\s*["\']([^"\']+)["\'][^>]*>.*?</color>',
              re.DOTALL
          )

          changed = 0

          for root, _, files in os.walk(project_dir):
              if not os.path.basename(root).startswith("values"):
                  continue

              for filename in files:
                  if not filename.endswith(".xml"):
                      continue

                  path = os.path.join(root, filename)

                  try:
                      with open(path, "r", encoding="utf-8") as f:
                          text = f.read()
                  except UnicodeDecodeError:
                      continue

                  matches = list(color_pattern.finditer(text))

                  if not matches:
                      continue

                  seen = set()
                  removed = 0
                  output = []
                  last = 0

                  for match in matches:
                      output.append(text[last:match.start()])

                      name = match.group(1)

                      if name in seen:
                          removed += 1
                      else:
                          seen.add(name)
                          output.append(match.group(0))

                      last = match.end()

                  output.append(text[last:])
                  new_text = "".join(output)

                  if removed:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(new_text)

                      changed += 1
                      print(
                          f"Removed {removed} duplicate color resource(s): {path}"
                      )

          print(
              f"Duplicate color cleanup complete. Files changed: {changed}"
          )
          PY

      - name: Verify Launcher Colors
        shell: bash
        run: |
          set -e

          echo "Checking launcher color resources..."

          find "$PROJECT_DIR" -type f \
            -path '*/src/main/res/values*/launcher_colors.xml' \
            -print

          while IFS= read -r FILE; do
            echo "---- $FILE"
            grep -nE \
              'name="(launcher_bg|launcher_fg|launcher_text)"' \
              "$FILE" || true
          done < <(
            find "$PROJECT_DIR" -type f \
              -path '*/src/main/res/values*/launcher_colors.xml' \
              -print
          )

      - name: Clean Android Build
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf app/build

          gradle clean --no-daemon

      - name: Build PRIYO STORE V91 Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Gradle version:"
          gradle --version

          echo "Building PRIYO STORE V91..."

          gradle assembleDebug --no-daemon --stacktrace

      - name: Find V91 APK
        shell: bash
        run: |
          set -e

          APK_FILE="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR" -type f \
              -path '*/build/outputs/**/*.apk' \
              -print || true
            exit 1
          fi

          mkdir -p release

          cp "$APK_FILE" "release/PRIYO-STORE-V91.apk"

          echo "APK ready:"
          ls -lh "release/PRIYO-STORE-V91.apk"

      - name: Upload PRIYO STORE V91 APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-V91-APK
          path: release/PRIYO-STORE-V91.apk
          if-no-files-found: error
