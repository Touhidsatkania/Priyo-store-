name: PRIYO STORE APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Setup Gradle
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # ==========================================
      # 4. Prepare PRIYO STORE project
      # ==========================================
      - name: Prepare project
        shell: bash
        run: |
          set -e

          ZIP_FILE="PRIYO_STORE_V90_LOGIN_SESSION_FIXED.zip"

          echo "=========================================="
          echo "       PRIYO STORE V90 APK BUILD"
          echo "=========================================="

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 3 -type f -name "*.zip" -print
            exit 1
          fi

          rm -rf build_source
          mkdir -p build_source

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d build_source

          echo ""
          echo "Extracted successfully."


      # ==========================================
      # 5. Find Android project
      # ==========================================
      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          echo "Searching Android project..."

          SETTINGS_FILE=$(find build_source \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            find build_source -maxdepth 8 -type f | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 6. Fix duplicate launcher_bg resource
      # ==========================================
      - name: Fix duplicate launcher_bg resource
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " Checking duplicate launcher_bg resources"
          echo "=========================================="

          python3 <<'PY'
          import os
          import re

          root = os.environ["PROJECT_DIR"]

          files = []

          for dirpath, _, filenames in os.walk(root):
              for filename in filenames:
                  if filename.endswith(".xml"):
                      full = os.path.join(dirpath, filename)

                      if os.path.basename(os.path.dirname(full)) == "values":
                          files.append(full)

          files.sort()

          pattern = re.compile(
              r'<color\s+name\s*=\s*["\']launcher_bg["\']\s*>.*?</color\s*>',
              re.DOTALL
          )

          found = []

          for path in files:
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      text = f.read()
              except Exception:
                  continue

              matches = pattern.findall(text)

              for match in matches:
                  found.append(path)

          print("launcher_bg definitions found:", len(found))

          if len(found) <= 1:
              print("No duplicate launcher_bg resource found.")
              raise SystemExit(0)

          keep = found[0]

          print("Keeping:")
          print(keep)

          for path in found[1:]:
              print("Removing duplicate from:")
              print(path)

              with open(path, "r", encoding="utf-8") as f:
                  text = f.read()

              text = pattern.sub("", text)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)

          print("Duplicate launcher_bg resources fixed.")
          PY


      # ==========================================
      # 7. Find Gradle wrapper
      # ==========================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found."
            echo "Generating wrapper..."

            gradle wrapper --gradle-version 8.7
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper ready."


      # ==========================================
      # 8. Clean previous build
      # ==========================================
      - name: Clean previous build
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean --no-daemon


      # ==========================================
      # 9. Build Debug APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "          BUILDING PRIYO STORE APK"
          echo "=========================================="

          ./gradlew assembleDebug --no-daemon --stacktrace

          echo "=========================================="
          echo "          APK BUILD SUCCESS"
          echo "=========================================="


      # ==========================================
      # 10. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | grep -E '/build/outputs/apk/debug/' \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/PRIYO-STORE-DEBUG.apk"


      # ==========================================
      # 11. Upload APK
      # ==========================================
      - name: Upload PRIYO STORE APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-APK
          path: PRIYO-STORE-DEBUG.apk
          if-no-files-found: error


      # ==========================================
      # 12. Build Summary
      # ==========================================
      - name: Build Summary
        shell: bash
        run: |
          echo "=========================================="
          echo " PRIYO STORE BUILD COMPLETED SUCCESSFULLY"
          echo "=========================================="
          echo ""
          echo "APK: PRIYO-STORE-DEBUG.apk"
          echo ""
          echo "Artifact: PRIYO-STORE-APK"
