name: PRIYO STORE APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Setup Gradle
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # ==========================================
      # 4. Prepare PRIYO STORE project
      # ==========================================
      - name: Prepare project
        shell: bash
        run: |
          set -e

          ZIP_FILE="PRIYO_STORE_V90_LOGIN_SESSION_FIXED.zip"

          echo "===== CHECKING PRIYO STORE ZIP ====="

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          rm -rf build_source
          mkdir -p build_source

          echo "Extracting PRIYO STORE..."

          unzip -q "$ZIP_FILE" -d build_source

          echo ""
          echo "===== EXTRACTED FILES ====="

          find build_source -maxdepth 8 -type f | head -300


      # ==========================================
      # 5. Find Android project
      # ==========================================
      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          echo "===== SEARCHING ANDROID PROJECT ====="

          SETTINGS_FILE=$(find build_source \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings file was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 6. Configure AndroidX
      # ==========================================
      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== CONFIGURING ANDROIDX ====="

          touch gradle.properties

          grep -qxF "android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -qxF "android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

          echo ""
          echo "===== gradle.properties ====="

          cat gradle.properties


      # ==========================================
      # 7. FIX KOTLIN DUPLICATE CLASSES
      # ==========================================
      - name: Configure Kotlin dependencies
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== CREATING KOTLIN FIX ====="

          cat > kotlin-fix.gradle <<'EOF'

          allprojects {

              configurations.configureEach {

                  // Kotlin 1.8+ already contains the JDK7/JDK8
                  // implementations inside kotlin-stdlib.
                  // Remove old separate JDK artifacts to prevent
                  // duplicate classes.

                  exclude(
                      group: "org.jetbrains.kotlin",
                      module: "kotlin-stdlib-jdk7"
                  )

                  exclude(
                      group: "org.jetbrains.kotlin",
                      module: "kotlin-stdlib-jdk8"
                  )

                  resolutionStrategy {

                      force(
                          "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                      )

                      eachDependency { details ->

                          if (details.requested.group == "org.jetbrains.kotlin") {

                              if (details.requested.name == "kotlin-stdlib" ||
                                  details.requested.name == "kotlin-stdlib-common") {

                                  details.useVersion("1.8.22")
                              }
                          }
                      }
                  }
              }
          }

          EOF

          echo ""
          echo "===== KOTLIN FIX ====="

          cat kotlin-fix.gradle


      # ==========================================
      # 8. Prepare Gradle Wrapper
      # ==========================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== PREPARING GRADLE WRAPPER ====="

          if [ -f "gradlew" ]; then

            echo "Existing Gradle wrapper found."

            chmod +x gradlew

          else

            echo "Gradle wrapper not found."
            echo "Creating Gradle wrapper using Gradle 8.7..."

            gradle wrapper --gradle-version 8.7

            chmod +x gradlew

          fi

          echo ""
          echo "===== PROJECT FILES ====="

          ls -la


      # ==========================================
      # 9. Clean build
      # ==========================================
      - name: Clean previous build
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== CLEAN BUILD ====="

          ./gradlew clean \
            --stacktrace \
            --no-daemon \
            --init-script kotlin-fix.gradle


      # ==========================================
      # 10. Build Debug APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo ""
          echo "=========================================="
          echo "       PRIYO STORE APK BUILD"
          echo "=========================================="

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --init-script kotlin-fix.gradle

          echo ""
          echo "=========================================="
          echo "       BUILD COMPLETED"
          echo "=========================================="


      # ==========================================
      # 11. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== SEARCHING FOR APK ====="

          APK=$(find . \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "===== APK FOUND ====="
          echo "$APK"

          APK_ABSOLUTE=$(realpath "$APK")

          echo "APK_PATH=$APK_ABSOLUTE" >> "$GITHUB_ENV"


      # ==========================================
      # 12. Upload APK
      # ==========================================
      - name: Upload PRIYO STORE APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error


      # ==========================================
      # 13. Build Summary
      # ==========================================
      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "        PRIYO STORE APK READY"
          echo "=========================================="
          echo ""
          echo "Artifact: PRIYO-STORE-APK"
          echo ""
          echo "BUILD SUCCESSFUL"
