name: PRIYO STORE Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build PRIYO STORE APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find PRIYO STORE source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname 'PRIYO_STORE_V*.zip' | sort -V | tail -n 1)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: No PRIYO_STORE_V*.zip found in repository root."
            exit 1
          fi
          echo "Using source: $ZIP"
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract PRIYO STORE source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-project
          mkdir -p android-project
          unzip -q "$SOURCE_ZIP" -d android-project

          test -f android-project/settings.gradle
          test -f android-project/build.gradle
          test -f android-project/app/build.gradle
          test -f android-project/app/src/main/AndroidManifest.xml
          test -f android-project/app/src/main/java/com/priyostore/app/MainActivity.java

          echo "PRIYO STORE source verified."

      - name: Enable AndroidX for PRIYO STORE
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail
          touch gradle.properties
          grep -q '^android.useAndroidX=true$' gradle.properties ||             echo 'android.useAndroidX=true' >> gradle.properties
          grep -q '^android.enableJetifier=true$' gradle.properties ||             echo 'android.enableJetifier=true' >> gradle.properties

          echo "AndroidX configuration verified:"
          grep -E '^(android\.useAndroidX|android\.enableJetifier)=' gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
          cache-cleanup: on-success

      - name: Build PRIYO STORE Debug APK
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "PRIYO STORE APK created successfully."

      - name: Upload PRIYO STORE APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-debug-${{ github.run_number }}
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-build-diagnostics-${{ github.run_number }}
          path: |
            android-project/app/build/reports/**
            android-project/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
