name: Build PRIYO STORE V91 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build PRIYO STORE V91
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find V90 Source ZIP
        shell: bash
        run: |
          set -e

          SOURCE_ZIP="$(find . -maxdepth 2 -type f \
            \( -name 'PRIYO_STORE_V90_LOGIN_SESSION_FIXED.zip' \
            -o -name 'PRIYO_STORE_V90*.zip' \) \
            -print -quit)"

          if [ -z "$SOURCE_ZIP" ]; then
            echo "ERROR: V90 source ZIP not found."
            exit 1
          fi

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$SOURCE_ZIP" -d build_source

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find build_source -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Inspect Android Project
        shell: bash
        run: |
          set -e

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Using Gradle 8.7"
          gradle --version

          echo "Starting Android build..."

          gradle clean assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_FILE="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          mkdir -p release
          cp "$APK_FILE" "release/PRIYO-STORE-V91.apk"

      - name: Upload PRIYO STORE V91 APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-V91-APK
          path: release/PRIYO-STORE-V91.apk
          if-no-files-found: error
