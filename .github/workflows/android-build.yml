name: PRIYO STORE V91 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build PRIYO STORE V91
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find V90 source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="PRIYO_STORE_V90_LOGIN_SESSION_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found: $ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf build_source
          mkdir -p build_source

          unzip -q \
            "PRIYO_STORE_V90_LOGIN_SESSION_FIXED.zip" \
            -d build_source

          echo "Source extracted successfully."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

