name: Build PRIYO STORE APK

on:
  push:
    branches:
      - main
    paths:
      - 'PRIYO_STORE_V*.zip'
      - '.github/workflows/android-build.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PRIYO STORE APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Select latest PRIYO STORE ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f \
            -name 'PRIYO_STORE_V*.zip' \
            -printf '%f\n' \
            | sort -V \
            | tail -n 1)"

          if [ -z "$ZIP" ]; then
            echo "::error::No PRIYO STORE ZIP found."
            exit 1
          fi

          echo "================================"
          echo "Selected ZIP: $ZIP"
          echo "================================"

          echo "PROJECT_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract PRIYO STORE project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$PROJECT_ZIP" -d extracted

          echo "ZIP CONTENT:"
          find extracted -maxdepth 4 -type f | sort | head -n 200

          echo "--------------------------------"

          GRADLEW="$(find extracted \
            -type f \
            -name 'gradlew' \
            -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew was not found inside the selected ZIP."
            echo ""
            echo "Searching for Gradle project files..."

            find extracted \
              -type f \
              \( -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \
              -o -name 'build.gradle' \
              -o -name 'build.gradle.kts' \
              \) \
              -print

            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Gradle wrapper:"
          echo "$GRADLEW"

          echo "Android project:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Android app module not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "Gradle Wrapper:"
          ./gradlew --version

      - name: Configure AndroidX
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          touch gradle.properties

          if ! grep -q '^android.useAndroidX=' gradle.properties; then
            echo 'android.useAndroidX=true' >> gradle.properties
          fi

          if ! grep -q '^android.enableJetifier=' gradle.properties; then
            echo 'android.enableJetifier=true' >> gradle.properties
          fi

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "================================"
          echo "ANDROID PROJECT"
          echo "================================"

          echo "Project: $PROJECT_DIR"

          echo ""
          echo "Settings:"
          ls -la settings.gradle* 2>/dev/null || true

          echo ""
          echo "App module:"
          ls -la app 2>/dev/null || true

          echo ""
          echo "Gradle:"
          ./gradlew --version

      - name: Build PRIYO STORE APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not created."
            exit 1
          fi

          echo "================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "================================"

          echo "APK: $APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload PRIYO STORE APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
