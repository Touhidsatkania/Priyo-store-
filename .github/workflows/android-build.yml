name: Build PRIYO STORE V95

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build PRIYO STORE V95 APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================================
      # GRADLE 8.9
      # =========================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # FIND ANDROID PROJECT
      # =========================================================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "SEARCHING FOR PRIYO STORE ANDROID PROJECT"
          echo "=================================================="

          PROJECT_DIR=""

          # --------------------------------------------------
          # 1. Check repository root
          # --------------------------------------------------
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            if [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
              PROJECT_DIR="$(pwd)"
              echo "Android project found in repository root."
            fi
          fi

          # --------------------------------------------------
          # 2. Search existing folders
          # --------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            while IFS= read -r settings_file; do

              [ -z "$settings_file" ] && continue

              candidate_dir="$(cd "$(dirname "$settings_file")" && pwd)"

              if [ -f "$candidate_dir/app/build.gradle" ] || \
                 [ -f "$candidate_dir/app/build.gradle.kts" ]; then

                PROJECT_DIR="$candidate_dir"
                echo "Android project found:"
                echo "$PROJECT_DIR"
                break

              fi

            done < <(
              find . \
                -type f \
                \
                  -name "settings.gradle" \
                  -o -name "settings.gradle.kts" \
                \
                -not -path "*/.git/*" \
                -not -path "*/build/*" \
                -print
            )

          fi

