name: PRIYO STORE APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. Checkout
      # ==============================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==============================
      # 2. Java 17
      # ==============================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==============================
      # 3. Setup Gradle
      # ==============================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # ==============================
      # 4. Prepare PRIYO STORE project
      # ==============================
      - name: Prepare project
        shell: bash
        run: |
          set -e

          ZIP_FILE="PRIYO_STORE_V75_FINAL_CLEAN.zip"

          echo "===== CHECKING ZIP ====="

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            exit 1
          fi

          rm -rf build_source
          mkdir -p build_source

          echo "Extracting PRIYO STORE..."

          unzip -q "$ZIP_FILE" -d build_source

          echo "===== ZIP CONTENT ====="

          find build_source -maxdepth 8 -type f | head -300


      # ==============================
      # 5. Find Android project
      # ==============================
      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          echo "===== SEARCHING ANDROID PROJECT ====="

          SETTINGS_FILE=$(find build_source \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==============================
      # 6. AndroidX configuration
      # ==============================
      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== CONFIGURING ANDROIDX ====="

          touch gradle.properties

          grep -qxF "android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -qxF "android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

          echo ""
          echo "===== gradle.properties ====="

          cat gradle.properties


      # ==============================
      # 7. Fix Kotlin duplicate classes
      # ==============================
      - name: Configure Kotlin dependency alignment
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== CREATING KOTLIN DEPENDENCY FIX ====="

          cat > kotlin-fix.gradle <<'EOF'

          allprojects {

              configurations.configureEach {

                  resolutionStrategy {

                      force(
                          "org.jetbrains.kotlin:kotlin-stdlib:1.8.22",
                          "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22",
                          "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
                      )

                      eachDependency { details ->

                          if (details.requested.group == "org.jetbrains.kotlin") {

                              details.useVersion("1.8.22")

                              details.because(
                                  "Align all Kotlin dependencies to prevent duplicate classes"
                              )
                          }
                      }
                  }
              }
          }

          EOF

          echo "Kotlin dependency alignment file created."

          echo ""
          echo "===== KOTLIN FIX ====="

          cat kotlin-fix.gradle


      # ==============================
      # 8. Prepare Gradle Wrapper
      # ==============================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== PREPARING GRADLE WRAPPER ====="

          if [ -f "gradlew" ]; then

            echo "Existing Gradle wrapper found."

            chmod +x gradlew

          else

            echo "Gradle wrapper not found."
            echo "Creating Gradle wrapper using Gradle 8.7..."

            gradle wrapper --gradle-version 8.7

            chmod +x gradlew

          fi

          echo ""
          echo "===== PROJECT FILES ====="

          ls -la


      # ==============================
      # 9. Clean old build
      # ==============================
      - name: Clean previous build
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== CLEAN BUILD ====="

          ./gradlew clean \
            --stacktrace \
            --no-daemon \
            --init-script kotlin-fix.gradle


      # ==============================
      # 10. Build Debug APK
      # ==============================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "===== PRIYO STORE BUILD ====="
          echo "================================"

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --init-script kotlin-fix.gradle

          echo ""
          echo "===== BUILD COMPLETED ====="


      # ==============================
      # 11. Find APK
      # ==============================
      - name: Find APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== SEARCHING FOR APK ====="

          APK=$(find . \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "===== APK FOUND ====="
          echo "$APK"

          echo "APK_PATH=$PROJECT_DIR/$APK" >> "$GITHUB_ENV"


      # ==============================
      # 12. Upload APK
      # ==============================
      - name: Upload PRIYO STORE APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error


      # ==============================
      # 13. Build summary
      # ==============================
      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo "================================"
          echo "     PRIYO STORE APK READY"
          echo "================================"
          echo ""
          echo "APK artifact: PRIYO-STORE-APK"
          echo ""
          echo "Build completed successfully."
