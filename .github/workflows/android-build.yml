name: Build PRIYO STORE APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PRIYO STORE APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract PRIYO STORE project
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q PRIYO_STORE_V95_FULL_PROJECT_FIXED.zip -d build-src

      - name: Verify Android project
        run: |
          test -f build-src/settings.gradle
          test -f build-src/build.gradle
          test -f build-src/app/build.gradle
          test -f build-src/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        working-directory: build-src
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-APK
          path: build-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
