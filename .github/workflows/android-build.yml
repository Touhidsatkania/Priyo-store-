name: Build PRIYO STORE V91 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build PRIYO STORE V91
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find V90 Source ZIP
        shell: bash
        run: |
          set -e

          SOURCE_ZIP="$(find . -maxdepth 3 -type f \
            \( \
              -name 'PRIYO_STORE_V90_LOGIN_SESSION_FIXED.zip' \
              -o -name 'PRIYO_STORE_V90*.zip' \
            \) \
            -print -quit)"

          if [ -z "$SOURCE_ZIP" ]; then
            echo "ERROR: PRIYO STORE V90 source ZIP not found."
            exit 1
          fi

          echo "Source ZIP found:"
          echo "$SOURCE_ZIP"

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Extract V90 Android Project
        shell: bash
        run: |
          set -e

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$SOURCE_ZIP" -d build_source

          echo "Source extracted successfully."

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find build_source -type f \
            \( \
              -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \
            \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings.gradle not found."
            echo "Extracted files:"
            find build_source -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Enable AndroidX and Jetifier
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/gradle"

          cat > "$PROJECT_DIR/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          EOF

          echo "AndroidX and Jetifier enabled."

      - name: Fix Duplicate Launcher Resources
        shell: bash
        run: |
          set -e

          python3 - "$PROJECT_DIR" <<'PY'
          import os
          import re
          import sys

          project_dir = sys.argv[1]

          patterns = [
              re.compile(
                  r'(<color\s+name=["\']launcher_bg["\'][^>]*>.*?</color>)',
                  re.DOTALL
              ),
              re.compile(
                  r'(<color\s+name=["\']launcher_fg["\'][^>]*>.*?</color>)',
                  re.DOTALL
              ),
              re.compile(
                  r'(<color\s+name=["\']launcher_text["\'][^>]*>.*?</color>)',
                  re.DOTALL
              ),
          ]

          fixed_files = 0

          for root, _, files in os.walk(project_dir):
              for filename in files:
                  if not filename.endswith(".xml"):
                      continue

                  if not os.path.basename(root).startswith("values"):
                      continue

                  path = os.path.join(root, filename)

                  try:
                      with open(path, "r", encoding="utf-8") as f:
                          text = f.read()
                  except Exception:
                      continue

                  original = text

                  for pattern in patterns:
                      seen = False

                      def keep_first(match):
                          nonlocal seen
                          if not seen:
                              seen = True
                              return match.group(1)
                          return ""

                      text = pattern.sub(keep_first, text)

                  if text != original:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(text)

                      fixed_files += 1
                      print("Fixed duplicate launcher resource:", path)

          print("Launcher resource cleanup completed.")
          print("Files changed:", fixed_files)
          PY

      - name: Remove Build Caches
        shell: bash
        run: |
          set -e

          rm -rf "$PROJECT_DIR/.gradle"
          rm -rf "$PROJECT_DIR/app/build"

          echo "Old build caches removed."

      - name: Inspect Android Project
        shell: bash
        run: |
          set -e

          echo "Android project structure:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

      - name: Build PRIYO STORE V91 Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Gradle version:"
          gradle --version

          echo "Starting PRIYO STORE V91 build..."

          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Find V91 APK
        shell: bash
        run: |
          set -e

          APK_FILE="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: PRIYO STORE V91 APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          echo "$APK_FILE"

          mkdir -p release

          cp "$APK_FILE" "release/PRIYO-STORE-V91.apk"

      - name: Upload PRIYO STORE V91 APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-V91-APK
          path: release/PRIYO-STORE-V91.apk
          if-no-files-found: error
