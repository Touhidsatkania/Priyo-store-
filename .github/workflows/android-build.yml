name: Build PRIYO STORE V91 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build PRIYO STORE V91
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find V90 Source ZIP
        shell: bash
        run: |
          set -e

          SOURCE_ZIP="$(find . -type f \
            \( -name 'PRIYO_STORE_V90_LOGIN_SESSION_FIXED.zip' \
            -o -name 'PRIYO_STORE_V90*.zip' \
            -o -name '*V90*.zip' \) \
            -print -quit)"

          if [ -z "$SOURCE_ZIP" ]; then
            echo "ERROR: V90 source ZIP not found."
            exit 1
          fi

          echo "Found source:"
          echo "$SOURCE_ZIP"

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Extract V90 Android Project
        shell: bash
        run: |
          set -e

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$SOURCE_ZIP" -d build_source

          echo "Source extracted successfully."

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find build_source -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings.gradle not found."
            find build_source -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Enable AndroidX and Jetifier
        shell: bash
        run: |
          set -e

          touch "$PROJECT_DIR/gradle.properties"

          if ! grep -q '^android.useAndroidX=' "$PROJECT_DIR/gradle.properties"; then
            echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          else
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              "$PROJECT_DIR/gradle.properties"
          fi

          if ! grep -q '^android.enableJetifier=' "$PROJECT_DIR/gradle.properties"; then
            echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"
          else
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' \
              "$PROJECT_DIR/gradle.properties"
          fi

          echo "AndroidX configuration:"
          cat "$PROJECT_DIR/gradle.properties"

      - name: Set PRIYO STORE V91 Version
        shell: bash
        run: |
          set -e

          echo "Searching Android Gradle files..."

          find "$PROJECT_DIR" -type f \
            \( -name 'build.gradle' -o -name 'build.gradle.kts' \) \
            -print

          while IFS= read -r FILE; do
            echo "Checking: $FILE"

            sed -i -E \
              's/versionCode[[:space:]]+[0-9]+/versionCode 91/g' \
              "$FILE" || true

            sed -i -E \
              's/versionName[[:space:]]+["'\''][^"'\'']+["'\'']/versionName "1.0.91"/g' \
              "$FILE" || true

          done < <(find "$PROJECT_DIR" -type f \
            \( -name 'build.gradle' -o -name 'build.gradle.kts' \))

          echo "V91 version configuration completed."

      - name: Inspect Android Project
        shell: bash
        run: |
          set -e

          echo "Project structure:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

      - name: Build PRIYO STORE V91 Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Gradle version:"
          gradle --version

          echo "Starting PRIYO STORE V91 build..."

          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Find V91 APK
        shell: bash
        run: |
          set -e

          APK_FILE="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: V91 APK was not generated."
            exit 1
          fi

          echo "V91 APK found:"
          echo "$APK_FILE"

          mkdir -p release

          cp "$APK_FILE" \
            "release/PRIYO-STORE-V91.apk"

          ls -lh release/PRIYO-STORE-V91.apk

      - name: Upload PRIYO STORE V91 APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIYO-STORE-V91-APK
          path: release/PRIYO-STORE-V91.apk
          if-no-files-found: error
